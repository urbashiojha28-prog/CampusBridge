    function CampusBridgeApp() {
      const [role, setRole] = useState("msme"); // 'msme' | 'college' | 'student'
      const [activeNav, setActiveNav] = useState("home");
      const [projects, setProjects] = useState(INITIAL_PROJECTS);
      const [selectedProjectId, setSelectedProjectId] = useState("PRJ-101");
      const [showPostModal, setShowPostModal] = useState(false);
      const [toast, setToast] = useState(null);

      // Post a Problem 5-field simple state
      const [formCategory, setFormCategory] = useState(OUTCOME_CATEGORIES[2]);
      const [formNeed, setFormNeed] = useState("");
      const [formOutcome, setFormOutcome] = useState("");
      const [formBudget, setFormBudget] = useState("65000");
      const [formWeeks, setFormWeeks] = useState("6");

      // Student progress update input
      const [studentNote, setStudentNote] = useState("");

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const activeCount = projects.filter(p => p.status === "In Progress").length;
      const completedCount = projects.filter(p => p.status === "Completed").length;
      const pendingApprovalCount = projects.filter(p => p.status === "Pending Approval").length;
      const incomingCollegeCount = projects.filter(p => p.status === "New Request").length;

      const selectedProject = projects.find(p => p.id === selectedProjectId) || projects[0];

      const handlePostProblem = (e) => {
        e.preventDefault();
        if (!formNeed.trim()) return;
        const newProj = {
          id: `PRJ-${100 + projects.length + 1}`,
          title: formNeed.trim(),
          msme: "Sharma Metals",
          location: "Neemrana Industrial Area",
          category: formCategory.label,
          problem: formNeed.trim(),
          outcome: formOutcome.trim() || `Deliver working ${formCategory.label.toLowerCase()} within ${formWeeks} weeks.`,
          budget: Number(formBudget) || 50000,
          deadline: "24 Feb",
          durationWeeks: Number(formWeeks) || 6,
          status: "New Request",
          progress: 0,
          college: "Waiting for ABC Engineering College",
          mentor: "Unassigned",
          domain: formCategory.domain,
          depts: formCategory.depts,
          students: [],
          updates: [
            { week: "Day 1", text: "Problem posted by Sharma Metals and sent to nearby colleges.", time: "Just now" }
          ],
          escrowPaid: "30% Advance Ready in Escrow"
        };
        setProjects([newProj, ...projects]);
        setSelectedProjectId(newProj.id);
        setShowPostModal(false);
        setFormNeed("");
        setFormOutcome("");
        notify("Problem sent to ABC Engineering College! Switch to 'College HOD' view to assign a team.");
      };

      const handleCollegeAssign = (projId) => {
        setProjects(projects.map(p => {
          if (p.id !== projId) return p;
          return {
            ...p,
            status: "In Progress",
            progress: 15,
            college: "ABC Engineering College",
            mentor: "Prof. Vikram Rathore (Innovation Cell)",
            students: [
              { name: "Aarav Verma", role: "Lead Developer", task: "Requirement visit & initial prototype setup", taskStatus: "In Progress" },
              { name: "Diya Sharma", role: "Hardware / Testing", task: "On-site measurement & data collection", taskStatus: "In Progress" },
              { name: "Karan Patel", role: "Integration", task: "Build simple owner interface", taskStatus: "Pending" },
              { name: "Neha Joshi", role: "Documentation", task: "Weekly photo updates & final manual", taskStatus: "Pending" }
            ],
            updates: [
              ...p.updates,
              { week: "Week 1", text: "College team assigned by ABC Engineering College. Factory visit scheduled.", time: "Just now" }
            ]
          };
        }));
        notify("College team assigned! MSME owner can now see progress updates.");
      };

      const handleApproveWork = (projId) => {
        setProjects(projects.map(p => {
          if (p.id !== projId) return p;
          return {
            ...p,
            status: "Completed",
            progress: 100,
            escrowPaid: "100% Released from Escrow",
            updates: [
              ...p.updates,
              { week: "Approved", text: "Kaam approved by Sharma Metals! Final escrow payment released.", time: "Just now" }
            ]
          };
        }));
        notify("Kaam Approved! Final escrow payment released & verified project added to student portfolios.");
      };

      const handleAddStudentUpdate = (projId) => {
        if (!studentNote.trim()) return;
        setProjects(projects.map(p => {
          if (p.id !== projId) return p;
          const nextProgress = Math.min(100, p.progress + 20);
          return {
            ...p,
            progress: nextProgress,
            status: nextProgress === 100 ? "Pending Approval" : p.status,
            updates: [
              ...p.updates,
              { week: `Update (${nextProgress}%)`, text: studentNote.trim(), time: "Just now" }
            ]
          };
        }));
        setStudentNote("");
        notify(selectedProject.progress + 20 >= 100
          ? "Final work submitted! Moved to 'Pending Approval' for MSME Owner."
          : "Plain-language progress update shared with MSME Owner!");
      };

      const navItems = role === "msme"
        ? [
            { id: "home", label: "Home", icon: "home" },
            { id: "projects", label: "Projects", icon: "briefcase" },
            { id: "notifications", label: "Notifications", icon: "bell", badge: 3 },
            { id: "profile", label: "Profile", icon: "user" },
            { id: "settings", label: "Company Settings", icon: "settings" }
          ]
        : role === "college"
        ? [
            { id: "home", label: "College Dashboard", icon: "home" },
            { id: "projects", label: "Incoming & Active", icon: "briefcase", badge: incomingCollegeCount || null },
            { id: "notifications", label: "Escrow & Splits", icon: "barChart" },
            { id: "profile", label: "Faculty & Teams", icon: "users" }
          ]
        : [
            { id: "home", label: "My Workspace", icon: "home" },
            { id: "projects", label: "Assigned Tasks", icon: "briefcase" },
            { id: "profile", label: "Verified Portfolio", icon: "award" }

                                <span className="font-bold text-slate-700">₹{p.budget.toLocaleString("en-IN")}</span>
                              </div>
                              <div className="font-bold text-sm text-slate-900">{p.title}</div>
                              <div className="text-xs text-slate-500 mt-1">{p.college}</div>
                            </button>
                          ))}
                        </div>

                        <div className="lg:col-span-2 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-5">
                          <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-100 pb-4">
                            <div>
                              <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-[#155EEF]">
                                {selectedProject.status}
                              </span>
                              <h2 className="text-xl font-bold text-slate-900 mt-2">{selectedProject.title}</h2>
                              <p className="text-xs text-slate-500 mt-1">
                                Managed by <strong>{selectedProject.college}</strong> • Mentor: {selectedProject.mentor}
                              </p>
                            </div>
                            <div className="bg-[#F4F7FC] px-4 py-3 rounded-xl text-right">
                              <div className="text-[11px] text-slate-500">Fixed All-Inclusive Price</div>
                              <div className="text-lg font-bold text-slate-900">
                                ₹{selectedProject.budget.toLocaleString("en-IN")}
                              </div>
                              <div className="text-[11px] text-emerald-600 font-medium">{selectedProject.escrowPaid}</div>
                            </div>
                          </div>

                          <div>
                            <h3 className="text-sm font-bold text-slate-900 mb-3">Aaj ka Update (Plain-Language Progress)</h3>
                            <div className="space-y-3">
                              {selectedProject.updates.map((u, idx) => (
                                <div key={idx} className="p-3.5 rounded-xl bg-[#F8FAFC] border border-slate-100 flex items-start justify-between gap-3">
                                  <div>
                                    <span className="text-xs font-bold text-[#155EEF]">{u.week}: </span>
                                    <span className="text-xs text-slate-700">{u.text}</span>
                                  </div>
                                  <span className="text-[11px] text-slate-400 shrink-0">{u.time}</span>
                                </div>
                              ))}
                            </div>
                          </div>

                          {selectedProject.status !== "Completed" && (
                            <div className="pt-2 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100">
                              <div className="text-xs text-slate-500">
                                Satisfied with the working demo & report?
                              </div>
                              <button
                                onClick={() => handleApproveWork(selectedProject.id)}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm transition cursor-pointer"
                              >
                                Kaam Approve Karein & Release Final Payment
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </main>
              )}

              {/* ================= COLLEGE HOD / INNOVATION CELL VIEW ================= */}
              {role === "college" && (
                <main className="p-6 max-w-7xl w-full mx-auto space-y-6">
                  <div className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-[#155EEF]">
                        College Innovation Cell & HOD Portal
                      </span>
                      <h1 className="text-2xl font-bold text-slate-900 mt-1">ABC Engineering College</h1>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Review MSME industry problems, assign faculty mentors & student teams, and track internal revenue splits.
                      </p>
                    </div>
                    <div className="flex gap-3">
                      <div className="px-4 py-2.5 rounded-xl bg-[#F4F7FC] text-center">
                        <div className="text-lg font-bold text-slate-900">{projects.length}</div>
                        <div className="text-[11px] text-slate-500">Industry Projects</div>
                      </div>
                      <div className="px-4 py-2.5 rounded-xl bg-emerald-50 text-center">
                        <div className="text-lg font-bold text-emerald-700">
                          ₹{projects.reduce((s, p) => s + p.budget, 0).toLocaleString("en-IN")}
                        </div>
                        <div className="text-[11px] text-emerald-700">Total Grant Value</div>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-7 space-y-4">
                      <h2 className="text-base font-bold text-slate-900">Industry Problem Queue</h2>
                      {projects.map(p => {
                        const studentFund = Math.round(p.budget * 0.5);
                        const collegeShare = Math.round(p.budget * 0.25);
                        const mentorShare = Math.round(p.budget * 0.1);
                        const materialsShare = Math.round(p.budget * 0.03);
                        const platformFee = p.budget - (studentFund + collegeShare + mentorShare + materialsShare);

                        return (
                          <div key={p.id} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-4">
                            <div className="flex items-start justify-between gap-3">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-[#155EEF]">
                                    {p.status}
                                  </span>
                                  <span className="text-xs text-slate-500">{p.msme} • {p.location}</span>
                                </div>
                                <h3 className="text-base font-bold text-slate-900 mt-1.5">{p.title}</h3>
                                <p className="text-xs text-slate-600 mt-1">{p.outcome}</p>
                              </div>
                              <div className="text-right shrink-0">
                                <div className="text-base font-bold text-slate-900">₹{p.budget.toLocaleString("en-IN")}</div>
                                <div className="text-[11px] text-slate-500">{p.durationWeeks} weeks</div>
                              </div>
                            </div>

                            {/* Auto-Classified Departments (Hidden from MSME) */}
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                              <span className="text-slate-500">Auto-Matched Departments:</span>
                              {p.depts.map(d => (
                                <span key={d} className="px-2.5 py-0.5 rounded-md bg-slate-100 font-semibold text-slate-700">
                                  {d}
                                </span>
                              ))}
                            </div>

                            {/* Internal Transparent Split (Visible to College, Hidden from MSME) */}
                            <div className="bg-[#F8FAFC] rounded-xl p-3.5 border border-slate-100">
                              <div className="text-[11px] font-bold text-slate-700 mb-2">
                                Internal Fee Split (Hidden from MSME Owner)
                              </div>
                              <div className="grid grid-cols-5 gap-2 text-center text-[11px]">
                                <div className="bg-white p-2 rounded-lg border border-slate-100">
                                  <div className="font-bold text-slate-900">₹{studentFund.toLocaleString("en-IN")}</div>
                                  <div className="text-slate-500">Students (50%)</div>
                                </div>
                                <div className="bg-white p-2 rounded-lg border border-slate-100">
                                  <div className="font-bold text-slate-900">₹{collegeShare.toLocaleString("en-IN")}</div>
                                  <div className="text-slate-500">College (25%)</div>
                                </div>
                                <div className="bg-white p-2 rounded-lg border border-slate-100">
                                  <div className="font-bold text-slate-900">₹{mentorShare.toLocaleString("en-IN")}</div>
                                  <div className="text-slate-500">Mentor (10%)</div>
                                </div>
                                <div className="bg-white p-2 rounded-lg border border-slate-100">
                                  <div className="font-bold text-slate-900">₹{materialsShare.toLocaleString("en-IN")}</div>
                                  <div className="text-slate-500">Materials (3%)</div>
                                </div>
                                <div className="bg-white p-2 rounded-lg border border-slate-100">
                                  <div className="font-bold text-slate-900">₹{platformFee.toLocaleString("en-IN")}</div>
                                  <div className="text-slate-500">Platform (12%)</div>
                                </div>
                              </div>
                            </div>

                            {p.status === "New Request" ? (
                              <button
                                onClick={() => handleCollegeAssign(p.id)}
                                className="w-full bg-[#155EEF] hover:bg-[#124ED1] text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer"
                              >
                                Check Feasibility & Assign Faculty + 4-Student Team
                              </button>
                            ) : (
                              <div className="text-xs text-slate-600 flex items-center justify-between pt-1">
                                <span>Faculty Mentor: <strong>{p.mentor}</strong></span>
                                <span>{p.students.length} Students Assigned</span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    <div className="lg:col-span-5 space-y-4">
                      <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-3">
                        <h3 className="text-sm font-bold text-slate-900">Why Colleges Stay in Control</h3>
                        <ul className="space-y-2.5 text-xs text-slate-600">
                          <li className="flex items-start gap-2">
                            <span className="text-emerald-600 font-bold">✓</span>
                            <span>MSME owners never negotiate directly with students; faculty mentors guarantee quality.</span>
                          </li>
                          <li className="flex items-start gap-2">
                            <span className="text-emerald-600 font-bold">✓</span>
                            <span>25% department share funds lab equipment while students earn verified placement portfolios.</span>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </main>
              )}

              {/* ================= STUDENT VIEW ================= */}
              {role === "student" && (
                <main className="p-6 max-w-7xl w-full mx-auto space-y-6">
                  <div className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-bold text-[#155EEF]">Student Workspace • No Business Jargon</span>
                      <h1 className="text-2xl font-bold text-slate-900 mt-1">Welcome back, Aarav Verma</h1>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Focus on building your assigned task, uploading weekly updates, and earning verified portfolio proof.
                      </p>
                    </div>
                    <div className="bg-emerald-50 border border-emerald-100 px-4 py-3 rounded-xl">
                      <div className="text-[11px] text-emerald-700 font-medium">Your Earned / Active Stipend Share</div>
                      <div className="text-lg font-bold text-emerald-800">₹15,625</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-7 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-50 text-[#155EEF]">
                            Active Assignment
                          </span>
                          <h2 className="text-lg font-bold text-slate-900 mt-1.5">{selectedProject.title}</h2>
                          <p className="text-xs text-slate-500">
                            Client: {selectedProject.msme} • Mentor: {selectedProject.mentor}
                          </p>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-bold text-[#155EEF]">{selectedProject.progress}% Done</div>
                          <div className="text-[11px] text-slate-400">Due {selectedProject.deadline}</div>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-[#F4F7FC] border border-blue-100 space-y-1">
                        <div className="text-xs font-bold text-slate-800">Your Specific Task:</div>
                        <div className="text-xs text-slate-600">
                          Train defect detection camera model on 200 metal gear images and upload test accuracy results.
                        </div>
                      </div>

                      {/* Post Simple Weekly Update */}
                      <div className="space-y-2 pt-2">
                        <label className="block text-xs font-bold text-slate-800">
                          Post Plain-Language Update for MSME Owner (No Technical Jargon)
                        </label>
                        <textarea
                          rows="2"
                          value={studentNote}
                          onChange={(e) => setStudentNote(e.target.value)}
                          placeholder="e.g., System detected 9 out of 10 scratched metal gears in factory floor testing."
                          className="w-full p-3 rounded-xl border border-slate-200 text-xs focus:border-[#155EEF] outline-none"
                        />
                        <button
                          onClick={() => handleAddStudentUpdate(selectedProject.id)}
                          className="bg-[#155EEF] hover:bg-[#124ED1] text-white text-xs font-semibold px-4 py-2.5 rounded-xl inline-flex items-center gap-1.5 transition cursor-pointer"
                        >
                          <Icon name="upload" className="w-3.5 h-3.5" />
                          <span>Upload Progress (+20%)</span>
                        </button>
                      </div>
                    </div>

                    {/* Verified Placement Portfolio */}
                    <div className="lg:col-span-5 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
                      <div className="flex items-center gap-2">
                        <Icon name="award" className="w-5 h-5 text-[#155EEF]" />
                        <h3 className="text-base font-bold text-slate-900">Verified Placement Portfolio</h3>
                      </div>
                      <p className="text-xs text-slate-500">
                        Completed industry projects are automatically signed by your HOD and MSME partner for placement interviews.
                      </p>
                      <div className="space-y-3">
                        {projects.filter(p => p.status === "Completed").length === 0 ? (
                          <div className="p-4 rounded-xl bg-[#F8FAFC] border border-dashed border-slate-200 text-xs text-slate-500">
                            Once Sharma Metals clicks <strong>Kaam Approve Karein</strong>, your verified credential appears here automatically.
                          </div>
                        ) : (
                          projects.filter(p => p.status === "Completed").map(cp => (
                            <div key={cp.id} className="p-4 rounded-xl bg-emerald-50/70 border border-emerald-200 space-y-1">
                              <div className="text-xs font-bold text-emerald-800">✓ Verified Industry Deliverable</div>
                              <div className="text-sm font-bold text-slate-900">{cp.title}</div>
                              <div className="text-xs text-slate-600">
                                Built for {cp.msme} • Signed by {cp.college}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </main>
              )}
            </div>
          </div>

          {/* ================= ULTRA-SIMPLE 5-FIELD POST A PROBLEM MODAL ================= */}
          {showPostModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5">
                <div className="flex items-start justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Post a New Problem</h2>
                    <p className="text-xs text-slate-500">
                      Aapko kya problem solve karni hai? Sirf 5 simple details bharein.
                    </p>
                  </div>
                  <button
                    onClick={() => setShowPostModal(false)}
                    className="text-slate-400 hover:text-slate-600 text-sm font-bold px-2 py-1"
                  >
                    ✕
                  </button>
                </div>

                {/* Simple Outcome Category Pills */}
                <div className="space-y-1.5">
                  <label className="block text-xs font-semibold text-slate-700">Choose a business result:</label>
                  <div className="grid grid-cols-2 gap-2">
                    {OUTCOME_CATEGORIES.map(cat => (
                      <button
                        type="button"
                        key={cat.id}
                        onClick={() => setFormCategory(cat)}
                        className={`p-2.5 rounded-xl border text-left transition ${
                          formCategory.id === cat.id
                            ? "bg-[#EBF3FF] border-[#155EEF] text-[#155EEF]"
                            : "bg-slate-50 border-slate-200/80 text-slate-700 hover:bg-slate-100"
                        }`}
                      >
                        <div className="text-[11px] font-medium opacity-80">{cat.hinglish}</div>
                        <div className="text-xs font-bold mt-0.5">{cat.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <form onSubmit={handlePostProblem} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      1. What do you need? (Aapko kya problem solve karni hai?)
                    </label>
                    <input
                      type="text"
                      required
                      value={formNeed}
                      onChange={(e) => setFormNeed(e.target.value)}
                      placeholder="e.g., Camera system to detect defective metal parts"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-[#155EEF] outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      2. What result do you want?
                    </label>
                    <input
                      type="text"
                      value={formOutcome}
                      onChange={(e) => setFormOutcome(e.target.value)}
                      placeholder="e.g., System should identify scratched or wrongly drilled parts"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-[#155EEF] outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">
                        3. Budget (Kitna kharcha?)
                      </label>
                      <input
                        type="number"
                        value={formBudget}
                        onChange={(e) => setFormBudget(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-[#155EEF] outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">
                        4. Deadline (Kitne weeks?)
                      </label>
                      <input
                        type="number"
                        value={formWeeks}
                        onChange={(e) => setFormWeeks(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:border-[#155EEF] outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      5. Upload photos / video (Optional)
                    </label>
                    <div className="border border-dashed border-slate-300 rounded-xl p-3 text-center text-xs text-slate-500 bg-slate-50">
                      Click to attach machine/part photo or WhatsApp voice note
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#155EEF] hover:bg-[#124ED1] text-white font-semibold text-sm py-3 rounded-xl shadow-sm transition cursor-pointer"
                  >
                    Send to Nearby Colleges
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CampusBridgeApp />);
  </script>
</body>
</html>
